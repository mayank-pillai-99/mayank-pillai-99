<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="Mayank Pillai GitHub stats">
<title>Mayank Pillai GitHub stats</title>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
  </pattern></defs>
<style>
  .in { animation: in .7s cubic-bezier(.22,1,.36,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .grow { animation: grow 1s cubic-bezier(.22,1,.36,1) both; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .grow-x { animation: growx 1.1s cubic-bezier(.22,1,.36,1) .2s both; }
  @keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<path d="M1 1H541L559 19V249H19L1 231Z" fill="#0b0b0f" stroke="#2c2c3a" stroke-width="2"/>
<path d="M1 1H541L559 19V249H19L1 231Z" fill="url(#grid)"/>
<rect x="1" y="1" width="540" height="3" fill="#ffd400"/>
