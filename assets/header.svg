  @keyframes stripe { to { transform: translateX(-56px); } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
