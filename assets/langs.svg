  .grow-x { animation: growx 1.1s cubic-bezier(.22,1,.36,1) .2s both; }
  @keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
